name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Rebuild daily at 04:00 UTC to pick up any new math commits from Cryptography_Exam
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website Engine
        uses: actions/checkout@v4

      - name: Checkout Math Vault (Cryptography_Exam)
        uses: actions/checkout@v4
        with:
          repository: ZeusDM/Cryptography_Exam
          path: math_vault

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Generate Hugo Content from Math Vault
        run: |
          python3 scripts/generate_site.py --math-dir math_vault/problems

      - name: Build Hugo Site
        run: |
          hugo --source site --minify --destination public

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
